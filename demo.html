<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>扎口Job · 跨端岗位卡与双历史交互演示台</title>
    <style>
      body {
        margin: 0;
        background: #ededed;
        color: #242424;
      }

      .zj-demo-shell {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px 16px 48px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .zj-demo-toolbar {
        background: var(--zj-panel);
        border: 1px solid var(--zj-line);
        border-radius: 20px;
        padding: 14px 16px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .zj-demo-brand {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 10px;
      }

      .zj-demo-brand strong {
        font-size: 18px;
        font-weight: 650;
      }

      .zj-demo-tag {
        font-size: 12px;
        color: var(--zj-muted);
      }

      .zj-demo-controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 12px;
      }

      .zj-demo-group {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .zj-demo-chip {
        min-height: 34px;
        padding: 6px 11px;
        border-radius: 12px;
        background: var(--zj-subtle);
        color: var(--zj-text);
        font-size: 12px;
        font-weight: 500;
      }

      .zj-demo-chip.is-active {
        background: var(--zj-blue-bg);
        color: var(--zj-blue);
        font-weight: 600;
      }

      .zj-demo-chip.is-primary {
        background: var(--zj-primary-fill);
        color: var(--zj-primary-ink);
        font-weight: 600;
      }

      .zj-demo-font-check {
        background: var(--zj-panel);
        border-radius: 20px;
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .zj-demo-font-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 12px;
        color: var(--zj-muted);
      }

      .zj-demo-label {
        font-weight: 600;
        color: var(--zj-text);
      }

      .zj-demo-font-samples {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 20px;
      }

      .zj-demo-sample-input {
        flex: 1 1 280px;
        max-width: 420px;
      }

      .zj-demo-log {
        background: var(--zj-panel);
        border: 1px solid var(--zj-line);
        border-radius: 14px;
        padding: 10px 14px;
        font-size: 12px;
        color: var(--zj-blue);
        font-variant-numeric: tabular-nums;
      }

      .zj-demo-section {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .zj-demo-section-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .zj-demo-section-head h2 {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
      }

      .zj-demo-section-head p {
        margin: 2px 0 0;
        font-size: 12px;
        color: var(--zj-muted);
      }

      .zj-demo-desktop-stage {
        width: 100%;
        margin: 0 auto;
        background: var(--zj-bg);
        padding: 20px;
        border-radius: 28px;
        border: 1px solid var(--zj-line);
        overflow-x: auto;
      }

      .zj-demo-desktop-stage[data-width="1024"] {
        max-width: 1024px;
      }

      .zj-demo-desktop-stage[data-width="820"] {
        max-width: 820px;
      }

      .zj-demo-mobile-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr));
        gap: 20px;
        align-items: start;
      }

      .zj-demo-phone-col {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .zj-demo-col-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--zj-muted);
      }

      .zj-demo-phone-frame {
        width: 100%;
        max-width: 390px;
        background: var(--zj-bg);
        border: 1px solid var(--zj-line);
        border-radius: 28px;
        padding: 16px;
        overflow: hidden;
      }

      .zj-demo-phone-frame[data-width="320"] {
        max-width: 320px;
        padding: 12px;
      }

      .zj-demo-phone-frame[data-width="430"] {
        max-width: 430px;
      }

      @media (max-width: 600px) {
        .zj-demo-desktop-stage {
          padding: 12px;
        }
      }
    </style>
  </head>
  <body>
    <main id="demo-app"></main>
    <script type="module" src="./src/ui/demo/demo-app.ts"></script>
  </body>
</html>
